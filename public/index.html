<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quick Exchange</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: #07111f;
  color: #fff;
}

.container {
  width: min(1100px, 94%);
  margin: auto;
}

header {
  padding: 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: 800;
}

.support {
  display: flex;
  gap: 10px;
}

.support a {
  color: #fff;
  text-decoration: none;
  background: #102238;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 13px;
}

.hero {
  text-align: center;
  padding: 45px 0 25px;
}

.hero h1 {
  font-size: clamp(32px, 6vw, 58px);
  margin: 0 0 12px;
}

.hero p {
  color: #9fb0c5;
  margin: 0;
}

.card {
  max-width: 620px;
  margin: 35px auto;
  background: #0d1b2e;
  border: 1px solid #1b324d;
  border-radius: 24px;
  padding: 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

label {
  display: block;
  color: #a9b9cc;
  font-size: 13px;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  padding: 15px;
  border-radius: 13px;
  border: 1px solid #29425f;
  background: #071525;
  color: #fff;
  outline: none;
  font-size: 15px;
}

input:focus,
select:focus {
  border-color: #22c7b8;
}

.field {
  margin-bottom: 20px;
}

.rate-box {
  padding: 14px;
  background: #071525;
  border: 1px solid #1e3b56;
  border-radius: 14px;
  margin-bottom: 18px;
}

.rate-box strong {
  color: #2dd4bf;
}

.receive-box {
  background: #071525;
  border-radius: 15px;
  padding: 16px;
  margin: 15px 0;
}

.receive-amount {
  font-size: 30px;
  font-weight: 800;
  margin-top: 7px;
}

.receiver-fields {
  display: none;
}

button {
  width: 100%;
  border: 0;
  padding: 16px;
  border-radius: 14px;
  background: #17bfae;
  color: #031018;
  font-weight: 800;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  opacity: .9;
}

.info {
  text-align: center;
  color: #8296ad;
  font-size: 13px;
  margin-top: 20px;
}

.upi-section {
  margin-top: 25px;
}

.upi-card {
  background: #081727;
  border: 1px solid #203b56;
  padding: 14px;
  border-radius: 14px;
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.upi-name {
  font-weight: 700;
}

.countdown {
  color: #2dd4bf;
  font-weight: 700;
  font-size: 13px;
}

.error {
  color: #ff7b7b;
  margin: 10px 0;
  text-align: center;
}

@media(max-width:600px) {
  .support {
    display: none;
  }

  .card {
    padding: 18px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">⚡ Quick Exchange</div>

  <div class="support" id="support"></div>
</header>

<section class="hero">
  <h1>Fast & Simple Exchange</h1>
  <p>Send your payment and receive through your preferred method.</p>
</section>

<div class="card">

  <div class="field">
    <label>Amount You Send</label>

    <input
      id="amount"
      type="number"
      min="0"
      placeholder="Enter amount"
    >
  </div>

  <div class="field">
    <label>Receive With</label>

    <select id="receiveMethod">
      <option value="">Loading methods...</option>
    </select>
  </div>

  <div class="rate-box">
    Exchange Rate:
    <strong id="rateText">—</strong>
  </div>

  <div class="receive-box">
    <label>You Receive</label>

    <div class="receive-amount" id="receiveAmount">
      0
    </div>
  </div>

  <div id="receiverFields" class="receiver-fields">

    <div id="normalReceiver">

      <div class="field">
        <label>Receiver Name</label>

        <input
          id="receiverName"
          type="text"
          placeholder="Full name"
        >
      </div>

      <div class="field">
        <label>Receiver Number</label>

        <input
          id="receiverNumber"
          type="text"
          placeholder="Account / mobile number"
        >
      </div>

    </div>

    <div id="usdtReceiver" style="display:none">

      <div class="field">
        <label>USDT Network</label>

        <select id="network">
          <option value="TRC20">TRC20</option>
          <option value="BEP20">BEP20</option>
          <option value="ERC20">ERC20</option>
        </select>
      </div>

      <div class="field">
        <label>USDT Wallet Address</label>

        <input
          id="wallet"
          type="text"
          placeholder="Wallet address"
        >
      </div>

    </div>

  </div>

  <div id="error" class="error"></div>

  <button id="continueBtn">
    Continue
  </button>

  <div class="info">
    Your exchange rate is locked when the order is created.
  </div>

</div>

</div>

<script>

let publicData = null;

const amountInput =
  document.getElementById("amount");

const methodSelect =
  document.getElementById("receiveMethod");

const rateText =
  document.getElementById("rateText");

const receiveAmount =
  document.getElementById("receiveAmount");

const receiverFields =
  document.getElementById("receiverFields");

const normalReceiver =
  document.getElementById("normalReceiver");

const usdtReceiver =
  document.getElementById("usdtReceiver");

const errorBox =
  document.getElementById("error");

async function loadPublic() {

  const response =
    await fetch("/api/public");

  const data =
    await response.json();

  if (!data.success) {
    throw new Error(
      data.message ||
      "Unable to load."
    );
  }

  publicData = data;

  renderMethods();

  renderSupport();

  calculate();
}

function renderMethods() {

  methodSelect.innerHTML = "";

  const methods =
    publicData.paymentMethods || [];

  if (!methods.length) {

    methodSelect.innerHTML =
      `<option value="">No methods available</option>`;

    return;
  }

  methods.forEach(method => {

    const option =
      document.createElement("option");

    option.value =
      method.id;

    option.textContent =
      `${method.flag || "🌐"} ${method.name}`;

    methodSelect.appendChild(option);
  });

  methodSelect.value =
    methods[0].id;
}

function renderSupport() {

  const box =
    document.getElementById("support");

  const contact =
    publicData.settings.contact || {};

  let html = "";

  if (contact.whatsapp) {
    html +=
      `<a href="${escapeAttr(contact.whatsapp)}" target="_blank">WhatsApp</a>`;
  }

  if (contact.telegram) {
    html +=
      `<a href="${escapeAttr(contact.telegram)}" target="_blank">Telegram</a>`;
  }

  box.innerHTML = html;
}

function getMethod() {

  return (
    publicData.paymentMethods || []
  ).find(
    method =>
      method.id ===
      methodSelect.value
  );
}

function calculate() {

  const method =
    getMethod();

  if (!method) {
    rateText.textContent = "—";
    receiveAmount.textContent = "0";
    return;
  }

  const amount =
    Number(amountInput.value) || 0;

  const fee =
    Number(
      publicData.settings.feePercent
    ) || 0;

  const gross =
    amount * Number(method.rate);

  const finalAmount =
    gross -
    gross * (fee / 100);

  rateText.textContent =
    `1 unit = ${method.rate}`;

  receiveAmount.textContent =
    formatNumber(
      Math.max(finalAmount, 0)
    );

  receiverFields.style.display =
    "block";

  if (
    method.id === "usdt"
  ) {
    normalReceiver.style.display =
      "none";

    usdtReceiver.style.display =
      "block";
  } else {
    normalReceiver.style.display =
      "block";

    usdtReceiver.style.display =
      "none";
  }
}

async function createOrder() {

  errorBox.textContent = "";

  const method =
    getMethod();

  const amount =
    Number(amountInput.value);

  if (!method) {
    errorBox.textContent =
      "Please select a receiving method.";

    return;
  }

  if (
    !amount ||
    amount <= 0
  ) {
    errorBox.textContent =
      "Please enter an amount.";

    return;
  }

  const body = {
    amount,
    receiveMethod:
      method.id,

    receiverName:
      document.getElementById(
        "receiverName"
      ).value,

    receiverNumber:
      document.getElementById(
        "receiverNumber"
      ).value,

    wallet:
      document.getElementById(
        "wallet"
      ).value,

    network:
      document.getElementById(
        "network"
      ).value
  };

  try {

    const response =
      await fetch(
        "/api/orders",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );

    const data =
      await response.json();

    if (!data.success) {
      throw new Error(
        data.message
      );
    }

    window.location.href =
      "/order?id=" +
      encodeURIComponent(
        data.order.id
      );

  } catch (error) {

    errorBox.textContent =
      error.message ||
      "Unable to create order.";
  }
}

function formatNumber(value) {

  return Number(value)
    .toLocaleString(
      undefined,
      {
        maximumFractionDigits: 8
      }
    );
}

function escapeAttr(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

amountInput.addEventListener(
  "input",
  calculate
);

methodSelect.addEventListener(
  "change",
  calculate
);

document
  .getElementById("continueBtn")
  .addEventListener(
    "click",
    createOrder
  );

loadPublic().catch(error => {

  errorBox.textContent =
    error.message ||
    "Unable to load exchange.";
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quick Exchange - Status</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: min(700px, 94%);
  margin: auto;
}

.card {
  margin-top: 60px;
  background: #0d1b2e;
  border: 1px solid #1c3753;
  border-radius: 22px;
  padding: 25px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  margin-bottom: 30px;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #20364c;
}

.label {
  color: #91a4ba;
}

.status {
  text-transform: uppercase;
  color: #2dd4bf;
  font-weight: 800;
}

a {
  color: #2dd4bf;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
⚡ Quick Exchange
</div>

<div class="row">
<span class="label">Order ID</span>
<strong id="id">—</strong>
</div>

<div class="row">
<span class="label">Amount Sent</span>
<strong id="amount">—</strong>
</div>

<div class="row">
<span class="label">Receive Method</span>
<strong id="method">—</strong>
</div>

<div class="row">
<span class="label">Locked Rate</span>
<strong id="rate">—</strong>
</div>

<div class="row">
<span class="label">Receive Amount</span>
<strong id="receive">—</strong>
</div>

<div class="row">
<span class="label">Payment Reference</span>
<strong id="reference">—</strong>
</div>

<div class="row">
<span class="label">Status</span>
<strong id="status" class="status">—</strong>
</div>

<br>

<a href="/">
← Back to Exchange
</a>

</div>

</div>

<script>

const id =
new URLSearchParams(
window.location.search
).get("id");

async function load() {

if (!id) return;

const response =
await fetch(
"/api/orders/" +
encodeURIComponent(id)
);

const data =
await response.json();

if (!data.success) {
document.body.innerHTML =
"<h2 style='padding:30px'>Order not found.</h2>";
return;
}

const order =
data.order;

document.getElementById(
"id"
).textContent =
order.id;

document.getElementById(
"amount"
).textContent =
format(order.amount);

document.getElementById(
"method"
).textContent =
order.paymentMethodName ||
order.paymentMethod;

document.getElementById(
"rate"
).textContent =
order.rate;

document.getElementById(
"receive"
).textContent =
format(order.receiveAmount);

document.getElementById(
"reference"
).textContent =
order.paymentReference ||
"Not submitted";

document.getElementById(
"status"
).textContent =
order.status;

}

function format(value) {

return Number(value)
.toLocaleString(
undefined,
{
maximumFractionDigits: 8
}
);

}

load();

setInterval(
load,
10000
);

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quick Exchange - Order</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: min(900px, 94%);
  margin: auto;
}

header {
  padding: 25px 0;
}

.logo {
  font-size: 24px;
  font-weight: 800;
}

.card {
  background: #0d1b2e;
  border: 1px solid #1d3854;
  border-radius: 22px;
  padding: 25px;
  margin-top: 20px;
}

.order-id {
  color: #2dd4bf;
  font-weight: 800;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #1b3047;
}

.label {
  color: #8ea3ba;
}

.value {
  font-weight: 700;
}

.upi {
  margin-top: 25px;
}

.upi-option {
  border: 1px solid #284560;
  background: #071525;
  border-radius: 15px;
  padding: 16px;
  margin: 10px 0;
}

.upi-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.upi-name {
  font-weight: 800;
}

.countdown {
  color: #2dd4bf;
  font-weight: 800;
}

.pay {
  margin-top: 12px;
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #17bfae;
  font-weight: 800;
  cursor: pointer;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid #29445e;
  background: #071525;
  color: white;
}

button.submit {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: #17bfae;
  font-weight: 800;
}

.message {
  margin-top: 12px;
  color: #ff8080;
}

.status {
  margin-top: 25px;
  padding: 15px;
  border-radius: 12px;
  background: #071525;
}

a {
  color: #2dd4bf;
}

</style>

</head>

<body>

<div class="container">

<header>
  <div class="logo">⚡ Quick Exchange</div>
</header>

<div class="card">

  <div>
    Order ID:
    <span id="orderId" class="order-id">
      Loading...
    </span>
  </div>

  <div class="row">
    <span class="label">You Send</span>
    <span class="value" id="sendAmount">—</span>
  </div>

  <div class="row">
    <span class="label">Receive Method</span>
    <span class="value" id="method">—</span>
  </div>

  <div class="row">
    <span class="label">Locked Rate</span>
    <span class="value" id="rate">—</span>
  </div>

  <div class="row">
    <span class="label">You Receive</span>
    <span class="value" id="receiveAmount">—</span>
  </div>

</div>

<div class="card upi">

  <h2>Pay with UPI</h2>

  <p style="color:#91a4b8">
    Select an active payment option below.
  </p>

  <div id="upiList">
    Loading...
  </div>

</div>

<div class="card">

  <h2>Payment Reference</h2>

  <input
    id="paymentReference"
    placeholder="Enter transaction/reference ID"
  >

  <button
    class="submit"
    id="submitReference"
  >
    Submit Payment Reference
  </button>

  <div
    class="message"
    id="message"
  ></div>

</div>

<div class="card status">

  Current Status:
  <strong id="status">—</strong>

  <br><br>

  <a id="statusLink" href="#">
    Track Order
  </a>

</div>

</div>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const orderId =
  params.get("id");

let order = null;

let publicData = null;

let countdownTimer = null;

async function loadOrder() {

  if (!orderId) {
    document.body.innerHTML =
      "<h2 style='padding:30px'>Missing order ID.</h2>";

    return;
  }

  const response =
    await fetch(
      "/api/orders/" +
      encodeURIComponent(
        orderId
      )
    );

  const data =
    await response.json();

  if (!data.success) {
    throw new Error(
      data.message
    );
  }

  order = data.order;

  renderOrder();

  await loadPublic();

  startCountdowns();
}

function renderOrder() {

  document.getElementById(
    "orderId"
  ).textContent =
    order.id;

  document.getElementById(
    "sendAmount"
  ).textContent =
    formatNumber(
      order.amount
    );

  document.getElementById(
    "method"
  ).textContent =
    order.paymentMethodName ||
    order.paymentMethod;

  document.getElementById(
    "rate"
  ).textContent =
    order.rate;

  document.getElementById(
    "receiveAmount"
  ).textContent =
    formatNumber(
      order.receiveAmount
    );

  document.getElementById(
    "status"
  ).textContent =
    order.status;

  document.getElementById(
    "statusLink"
  ).href =
    "/status?id=" +
    encodeURIComponent(
      order.id
    );

  document.getElementById(
    "paymentReference"
  ).value =
    order.paymentReference ||
    "";
}

async function loadPublic() {

  const response =
    await fetch(
      "/api/public"
    );

  publicData =
    await response.json();

  renderUpi();
}

function renderUpi() {

  const box =
    document.getElementById(
      "upiList"
    );

  const links =
    publicData.upiLinks || [];

  if (!links.length) {

    box.innerHTML =
      `<p style="color:#8fa3ba">
        No active UPI payment option is currently available.
      </p>`;

    return;
  }

  box.innerHTML = "";

  links.forEach(upi => {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "upi-option";

    div.innerHTML = `
      <div class="upi-top">
        <div>
          <div class="upi-name">
            🇮🇳 ${escapeHtml(upi.name)}
          </div>

          <div style="color:#8296ad;margin-top:5px">
            ${escapeHtml(upi.label || "UPI Payment")}
          </div>
        </div>

        <div
          class="countdown"
          data-expiry="${upi.expiryAt || ""}"
          data-start="${upi.startAt || ""}"
        >
          Calculating...
        </div>
      </div>

      <button class="pay">
        Pay with this UPI
      </button>
    `;

    div
      .querySelector(".pay")
      .addEventListener(
        "click",
        () => selectUpi(upi.id)
      );

    box.appendChild(div);
  });
}

function startCountdowns() {

  if (countdownTimer) {
    clearInterval(
      countdownTimer
    );
  }

  updateCountdowns();

  countdownTimer =
    setInterval(
      updateCountdowns,
      1000
    );
}

async function updateCountdowns() {

  const elements =
    document.querySelectorAll(
      ".countdown"
    );

  let expired = false;

  elements.forEach(element => {

    const expiry =
      element.dataset.expiry;

    if (!expiry) {

      element.textContent =
        "Available";

      return;
    }

    const remaining =
      new Date(expiry).getTime() -
      Date.now();

    if (remaining <= 0) {

      element.textContent =
        "Expired";

      expired = true;

      return;
    }

    element.textContent =
      formatRemaining(
        remaining
      );
  });

  if (expired) {

    await loadPublic();

    startCountdowns();
  }
}

function formatRemaining(ms) {

  const totalSeconds =
    Math.max(
      0,
      Math.floor(ms / 1000)
    );

  const minutes =
    Math.floor(
      totalSeconds / 60
    );

  const seconds =
    totalSeconds % 60;

  return (
    minutes
      .toString()
      .padStart(2, "0") +
    ":" +
    seconds
      .toString()
      .padStart(2, "0") +
    " remaining"
  );
}

async function selectUpi(
  upiId
) {

  const message =
    document.getElementById(
      "message"
    );

  message.textContent = "";

  try {

    const response =
      await fetch(
        "/api/orders/" +
        encodeURIComponent(
          orderId
        ) +
        "/select-upi",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              upiId
            })
        }
      );

    const data =
      await response.json();

    if (!data.success) {
      throw new Error(
        data.message
      );
    }

    window.open(
      data.url,
      "_blank"
    );

  } catch (error) {

    message.textContent =
      error.message;
  }
}

async function submitReference() {

  const reference =
    document.getElementById(
      "paymentReference"
    ).value.trim();

  const message =
    document.getElementById(
      "message"
    );

  if (!reference) {

    message.textContent =
      "Please enter your payment reference.";

    return;
  }

  const response =
    await fetch(
      "/api/orders/" +
      encodeURIComponent(
        orderId
      ),
      {
        method: "PUT",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            paymentReference:
              reference
          })
      }
    );

  const data =
    await response.json();

  if (!data.success) {

    message.textContent =
      data.message;

    return;
  }

  message.style.color =
    "#2dd4bf";

  message.textContent =
    "Payment reference saved.";
}

function formatNumber(
  value
) {
  return Number(value)
    .toLocaleString(
      undefined,
      {
        maximumFractionDigits: 8
      }
    );
}

function escapeHtml(
  value
) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

document
  .getElementById(
    "submitReference"
  )
  .addEventListener(
    "click",
    submitReference
  );

loadOrder().catch(
  error => {
    document.getElementById(
      "message"
    ).textContent =
      error.message;
  }
);

</script>

</body>
</html>
